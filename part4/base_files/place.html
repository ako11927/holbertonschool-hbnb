<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Place Details</title>
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <style>
        .amenity-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #ecf0f1;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.95rem;
        }
        .amenity-icon {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <header>
        <img src="images/logo.png" alt="HBnB Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="login-button" id="login-link">Login</a>
        </nav>
    </header>

    <main>
        <!-- Place Details -->
        <section id="place-details" class="place-details">
            <!-- Details populated dynamically -->
        </section>

        <!-- Reviews -->
        <section id="reviews">
            <!-- Reviews populated dynamically -->
        </section>

        <!-- Add Review Form -->
        <section id="add-review">
            <h2>Add a Review</h2>
            <form id="review-form">
                <label for="review-text">Review:</label>
                <textarea id="review-text" name="review-text" required></textarea>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 HBnB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
